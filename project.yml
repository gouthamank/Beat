name: Beat
options:
  bundleIdPrefix: dev.gouthaman
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.0"
  createIntermediateGroups: true
# UITest is Debug under another bundle ID (dev.gouthaman.Beat.uitest), for UI tests and `make mac-test-run-fixtures`: its
# settings, and on iOS its whole container, are its own, so a UI test never changes the user's Beat (TESTING.md).
configs:
  Debug: debug
  Release: release
  UITest: debug
settings:
  base:
    SWIFT_VERSION: "6.0"
settingGroups:
  # The Mac app and its tests. Self-signed certificate in the login keychain: one identity for every build, so
  # macOS keeps Beat's Music and Keychain permissions across rebuilds (ad-hoc signing changed it each time).
  # Per target, not project-wide, so the iOS target can sign with an Apple ID's personal team instead.
  macSigning:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "Beat Local Signing"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    # The iOS team in Secrets.xcconfig must not reach the Mac's self-signed identity.
    DEVELOPMENT_TEAM: ""
# Shown in Xcode's sidebar for editing, not built into any target. Lists whatever is in Config when the
# project is generated, so Secrets.xcconfig appears once it exists (regenerate after creating it).
fileGroups:
  - Config
# Test-only: snapshot tests compare rendered views with reference images (TESTING.md). Nothing ships in the app.
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
targets:
  Beat:
    type: application
    platform: macOS
    sources:
      # Shared code plus the Mac's own; iPad and iPhone pieces live in Platform/iOS.
      - path: Beat
        excludes: ["Platform/iOS/**"]
    info:
      path: Beat/Info.plist
      properties:
        # "Beat", or "Beat Test" for the UI-test build (BEAT_DISPLAY_NAME), so the two never look alike.
        CFBundleDisplayName: $(BEAT_DISPLAY_NAME)
        CFBundleName: $(BEAT_DISPLAY_NAME)
        # The version shown in About Beat; raise it by hand for a release. The build number comes from git (Makefile).
        CFBundleShortVersionString: "1.2.0"
        NSHumanReadableCopyright: © 2026 Gouthaman Kumar. MIT License.
        # `make` fills both from git (commit count, short hash); builds from Xcode keep the defaults below.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BeatCommit: $(BEAT_COMMIT)
        # From Config/Secrets.xcconfig (git-ignored); empty in a build without one.
        LastFMAPIKey: $(LASTFM_API_KEY)
        LastFMSharedSecret: $(LASTFM_SHARED_SECRET)
        LSApplicationCategoryType: public.app-category.music
        NSAppleMusicUsageDescription: Beat reads your Music library to browse and play your songs. It never changes your library.
    configFiles:
      Debug: Config/Beat.xcconfig
      Release: Config/Beat.xcconfig
      UITest: Config/Beat.xcconfig
    entitlements:
      path: Beat/Beat.entitlements
      properties: {}
    settings:
      groups: [macSigning]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gouthaman.Beat
        CURRENT_PROJECT_VERSION: "1"
        BEAT_COMMIT: dev
        BEAT_DISPLAY_NAME: Beat
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        UITest:
          PRODUCT_BUNDLE_IDENTIFIER: dev.gouthaman.Beat.uitest
          BEAT_DISPLAY_NAME: Beat Test
    dependencies:
      - sdk: iTunesLibrary.framework
  BeatiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # Shared code plus iPad and iPhone pieces; the Mac's own (and its Info.plist and entitlements) stay out.
      - path: Beat
        excludes: ["Platform/macOS/**", "Info.plist", "Beat.entitlements"]
    info:
      path: Beat/Platform/iOS/Info.plist
      properties:
        # "Beat", or "Beat Test" for the UI-test build (BEAT_DISPLAY_NAME), so the two never look alike.
        CFBundleDisplayName: $(BEAT_DISPLAY_NAME)
        CFBundleName: $(BEAT_DISPLAY_NAME)
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BeatCommit: $(BEAT_COMMIT)
        LastFMAPIKey: $(LASTFM_API_KEY)
        LastFMSharedSecret: $(LASTFM_SHARED_SECRET)
        NSAppleMusicUsageDescription: Beat reads the music on this device to browse and play it. It never changes your library.
        # Keeps playing with the screen locked or Beat in the background.
        UIBackgroundModes: [audio]
        # The Simulator's library is audio files saved to Files > On My iPad > Beat (FolderLibrarySource).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # One window, as on the Mac: the now-playing bar, Now Playing and transitions assume a single one.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    configFiles:
      # DEVELOPMENT_TEAM (an Apple ID's personal team) comes from the git-ignored Secrets.xcconfig, for devices.
      Debug: Config/Beat.xcconfig
      Release: Config/Beat.xcconfig
      UITest: Config/Beat.xcconfig
    settings:
      base:
        # Beat.app and module Beat, as on the Mac (not the target's name).
        PRODUCT_NAME: Beat
        PRODUCT_BUNDLE_IDENTIFIER: dev.gouthaman.Beat
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        BEAT_COMMIT: dev
        BEAT_DISPLAY_NAME: Beat
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        UITest:
          PRODUCT_BUNDLE_IDENTIFIER: dev.gouthaman.Beat.uitest
          BEAT_DISPLAY_NAME: Beat Test
  BeatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Shared tests plus the Mac's own; iPad and iPhone ones live in BeatTests/iOS.
      - path: BeatTests
        excludes: ["iOS/**"]
    settings:
      groups: [macSigning]
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.gouthaman.BeatTests
    dependencies:
      - target: Beat
      - package: SnapshotTesting
  # The same shared tests, run inside the iOS app on a Simulator (`make ios-test`).
  BeatiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BeatTests
        excludes: ["macOS/**"]
    configFiles:
      Debug: Config/Beat.xcconfig
      Release: Config/Beat.xcconfig
      UITest: Config/Beat.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.gouthaman.BeatiOSTests
        CODE_SIGN_STYLE: Automatic
        # The app is Beat.app (PRODUCT_NAME), not the target's name, which XcodeGen's default host assumes.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Beat.app/Beat
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: BeatiOS
      - package: SnapshotTesting
  # Mac UI tests: launch the UI-test build on the fixture songs and drive it (`make test-ui`, TESTING.md).
  BeatUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [BeatUITests]
    settings:
      groups: [macSigning]
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.gouthaman.BeatUITests
    dependencies:
      - target: Beat
  # iPhone and iPad UI tests: the UI-test build (its own app and container on the Simulator) on the fixture songs
  # (`make ios-test-ui`, TESTING.md).
  BeatiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources: [BeatiOSUITests]
    configFiles:
      Debug: Config/Beat.xcconfig
      Release: Config/Beat.xcconfig
      UITest: Config/Beat.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.gouthaman.BeatiOSUITests
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: BeatiOS
schemes:
  Beat:
    build:
      targets:
        Beat: all
        BeatTests: [test]
    test:
      targets: [BeatTests]
  # The UITest configuration: the app under its own bundle ID, so tests never touch the user's Beat.
  BeatUITests:
    build:
      targets:
        Beat: all
        BeatUITests: [test]
    test:
      config: UITest
      targets: [BeatUITests]
  BeatiOSUITests:
    build:
      targets:
        BeatiOS: all
        BeatiOSUITests: [test]
    test:
      config: UITest
      targets: [BeatiOSUITests]
  BeatiOS:
    build:
      targets:
        BeatiOS: all
        BeatiOSTests: [test]
    run:
      config: Debug
    test:
      targets: [BeatiOSTests]
